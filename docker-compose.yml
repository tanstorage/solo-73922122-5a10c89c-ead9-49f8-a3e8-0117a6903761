services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinical
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  # 双实例：同一镜像、同一数据库，验证重叠人群并发查询不超支、
  # 查询号跨实例幂等。两个实例都提供导出页与带噪查询页。
  app1:
    build: ./app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clinical
      EXPORT_DIR: /data/exports
      INSTANCE_NAME: app1
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  app2:
    build: ./app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clinical
      EXPORT_DIR: /data/exports
      INSTANCE_NAME: app2
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
